<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" fill="none">
  <defs>
    <!-- Dark / Cyberpunk Gradients -->
    <radialGradient id="edgy-bg-glow" cx="18%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
    </radialGradient>

    <!-- Stealth Polygon Facet Gradient -->
    <linearGradient id="edgy-poly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- HUD Cyan Ring Gradient -->
    <linearGradient id="edgy-hud-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Chrome/Neon Title Gradient -->
    <linearGradient id="edgy-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Cyberpunk Border Gradient -->
    <linearGradient id="edgy-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="30%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="70%" stop-color="rgba(0,240,255,0.4)" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    .edgy-title { font-family: "Impact", "Arial Black", -apple-system, sans-serif; font-size: 60px; font-weight: 900; letter-spacing: 6px; fill: url(#edgy-title-grad); }
    .edgy-eyebrow { font-family: "Courier New", Courier, monospace, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 3px; fill: #ff0055; text-transform: uppercase; }
    .edgy-tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: 1.2px; fill: #cbd5e1; }
    .edgy-pill-text { font-family: "Courier New", Courier, monospace, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; fill: #e2e8f0; }
    .edgy-hud-meta { font-family: "Courier New", Courier, monospace; font-size: 8px; fill: #64748b; letter-spacing: 1px; }
  </style>

  <!-- Chamfered Stealth Base Plate -->
  <polygon points="10,32 32,10 848,10 870,32 870,228 848,250 32,250 10,228" fill="#06070a" stroke="url(#edgy-border-grad)" stroke-width="2" />
  <polygon points="16,35 35,16 845,16 864,35 864,225 845,244 35,244 16,225" fill="url(#edgy-bg-glow)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- Tactical HUD Bracket Accents [ + ] -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.8">
    <path d="M24 40 L24 24 L40 24" fill="none" />
    <path d="M856 40 L856 24 L840 24" fill="none" />
    <path d="M24 220 L24 236 L40 236" fill="none" />
    <path d="M856 220 L856 236 L840 236" fill="none" />
    <line x1="435" y1="16" x2="445" y2="16" />
    <line x1="440" y1="12" x2="440" y2="20" />
    <line x1="435" y1="244" x2="445" y2="244" />
    <line x1="440" y1="240" x2="440" y2="248" />
  </g>

  <!-- Hazard Hash Stripes Accent -->
  <g fill="#ff0055" opacity="0.3">
    <polygon points="810,20 818,20 812,26 804,26" />
    <polygon points="822,20 830,20 824,26 816,26" />
    <polygon points="834,20 842,20 836,26 828,26" />
  </g>

  <!-- ════════ TACTICAL HUD LOGOMARK ════════ -->
  <g transform="translate(48, 38)">
    <!-- Ambient Red Core Shadow -->
    <ellipse cx="92" cy="164" rx="60" ry="10" fill="rgba(255, 0, 85, 0.3)" filter="blur(8px)" />

    <!-- Outer Targeting Ring with Chamfered Tick Marks -->
    <circle cx="92" cy="92" r="82" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" fill="none" />
    <circle cx="92" cy="92" r="82" stroke="url(#edgy-hud-ring)" stroke-width="3" stroke-dasharray="120 40 200 40" stroke-linecap="butt" fill="none" />

    <!-- Crosshair Lasers -->
    <line x1="92" y1="2" x2="92" y2="20" stroke="#00f0ff" stroke-width="2" />
    <line x1="92" y1="164" x2="92" y2="182" stroke="#ff0055" stroke-width="2" />
    <line x1="2" y1="92" x2="20" y2="92" stroke="#00f0ff" stroke-width="2" />
    <line x1="164" y1="92" x2="182" y2="92" stroke="#00f0ff" stroke-width="2" />

    <!-- Degree Marks -->
    <text x="92" y="16" class="edgy-hud-meta" text-anchor="middle">000&#176;</text>
    <text x="174" y="95" class="edgy-hud-meta">090&#176;</text>
    <text x="92" y="178" class="edgy-hud-meta" text-anchor="middle">180&#176;</text>
    <text x="10" y="95" class="edgy-hud-meta">270&#176;</text>

    <!-- Stealth Faceted Angular Tomato Body -->
    <polygon points="92,42 134,60 156,98 142,138 92,160 42,138 28,98 50,60" fill="url(#edgy-poly-grad)" stroke="#ff0055" stroke-width="1.5" filter="drop-shadow(0 0 16px rgba(255, 0, 85, 0.5))" />

    <!-- Low-Poly Armor Facet Shading -->
    <polygon points="92,42 92,98 50,60" fill="rgba(255, 255, 255, 0.15)" />
    <polygon points="50,60 92,98 28,98" fill="rgba(0, 0, 0, 0.3)" />
    <polygon points="28,98 92,98 42,138" fill="rgba(0, 0, 0, 0.45)" />
    <polygon points="42,138 92,98 92,160" fill="rgba(0, 0, 0, 0.25)" />
    <polygon points="92,160 92,98 142,138" fill="rgba(255, 0, 85, 0.1)" />
    <polygon points="142,138 92,98 156,98" fill="rgba(0, 0, 0, 0.2)" />
    <polygon points="156,98 92,98 134,60" fill="rgba(255, 255, 255, 0.08)" />
    <polygon points="134,60 92,98 92,42" fill="rgba(255, 255, 255, 0.22)" />

    <!-- Angular Stealth Calyx / Blades -->
    <polygon points="92,42 74,26 82,40 60,34 76,46 62,56 84,48" fill="#059669" stroke="#00f0ff" stroke-width="1" />
    <polygon points="92,42 110,26 102,40 124,34 108,46 122,56 100,48" fill="#059669" stroke="#00f0ff" stroke-width="1" />

    <!-- Cyber Optical Core / Targeting Dot -->
    <circle cx="92" cy="98" r="4" fill="#00f0ff" filter="drop-shadow(0 0 8px #00f0ff)" />
    <circle cx="92" cy="98" r="1.5" fill="#ffffff" />
  </g>

  <!-- ════════ BRAND TYPOGRAPHY & TACTICAL HUD ════════ -->
  <g transform="translate(268, 50)">
    <!-- Eyebrow HUD Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="24" rx="2" fill="rgba(255, 0, 85, 0.12)" stroke="#ff0055" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#ff0055" />
      <text x="24" y="16.5" class="edgy-eyebrow">[ + ] LOCKED IN &#8226; NO EXCUSES</text>
    </g>

    <!-- Wordmark -->
    <text x="0" y="80" class="edgy-title">POMIDOR</text>
    <text x="286" y="80" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#00f0ff" letter-spacing="2">// PROTOCOL</text>
    <!-- Cyan target dot over the O -->
    <circle cx="270" cy="54" r="4" fill="#00f0ff" filter="drop-shadow(0 0 8px #00f0ff)" />

    <!-- Tagline -->
    <text x="0" y="107" class="edgy-tagline">Kill Distractions &#8226; Zero Noise &#8226; Peak Tactical Execution</text>

    <!-- Tactical Feature Badges -->
    <g transform="translate(0, 126)">
      <!-- Badge 1: Kill Distractions -->
      <g transform="translate(0, 0)">
        <polygon points="0,0 148,0 140,26 0,26" fill="rgba(255, 0, 85, 0.12)" stroke="#ff0055" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#ff0055" />
        <text x="22" y="17" class="edgy-pill-text">KILL DISTRACTIONS</text>
      </g>

      <!-- Badge 2: Off-Grid Encrypted -->
      <g transform="translate(156, 0)">
        <polygon points="0,0 152,0 144,26 0,26" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#00f0ff" />
        <text x="22" y="17" class="edgy-pill-text">OFF-GRID ENCRYPTED</text>
      </g>

      <!-- Badge 3: Tactical Sprint -->
      <g transform="translate(316, 0)">
        <polygon points="0,0 140,0 132,26 0,26" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#f59e0b" />
        <text x="22" y="17" class="edgy-pill-text">TACTICAL SPRINT</text>
      </g>

      <!-- Badge 4: Zero Noise -->
      <g transform="translate(464, 0)">
        <polygon points="0,0 110,0 102,26 0,26" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="22" y="17" class="edgy-pill-text">ZERO NOISE</text>
      </g>
    </g>
  </g>
</svg>
