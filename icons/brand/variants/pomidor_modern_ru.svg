<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="ru-bg-glow" cx="22%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Tomato 3D sphere gradient -->
    <radialGradient id="ru-tomato-body" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Specular highlight gradient -->
    <linearGradient id="ru-tomato-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Calyx/Leaves gradient -->
    <linearGradient id="ru-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="ru-stem-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Timer Ring gradient -->
    <linearGradient id="ru-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="ru-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Outer card border gradient -->
    <linearGradient id="ru-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="50%" stop-color="rgba(16,185,129,0.3)" />
      <stop offset="100%" stop-color="rgba(239,68,68,0.2)" />
    </linearGradient>
  </defs>

  <style>
    .brand-title-ru { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", "Roboto", sans-serif; font-size: 56px; font-weight: 800; letter-spacing: 3px; fill: url(#ru-title-grad); }
    .brand-subtitle-ru { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "Roboto", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 4px; fill: #10b981; text-transform: uppercase; }
    .brand-tagline-ru { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "Roboto", sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.5px; fill: #94a3b8; }
    .brand-pill-text-ru { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "Roboto", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #cbd5e1; }
  </style>

  <!-- Double-Bezel Background Frame -->
  <rect x="10" y="10" width="860" height="240" rx="28" fill="#0b0f19" stroke="url(#ru-border-grad)" stroke-width="2" />
  <rect x="18" y="18" width="844" height="224" rx="20" fill="url(#ru-bg-glow)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- ════════ BRAND LOGOMARK (TOMATO & CHRONO RING) ════════ -->
  <g transform="translate(48, 38)">
    <!-- Ambient back-shadow -->
    <ellipse cx="92" cy="164" rx="64" ry="12" fill="rgba(0,0,0,0.5)" filter="blur(6px)" />

    <!-- Chrono Progress Ring (Concentric Track) -->
    <circle cx="92" cy="92" r="82" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" fill="none" />
    <circle cx="92" cy="92" r="82" stroke="url(#ru-ring-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="380 520" stroke-dashoffset="60" fill="none" />

    <!-- Cardinal Hour Marks -->
    <line x1="92" y1="18" x2="92" y2="24" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="166" y1="92" x2="160" y2="92" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="92" y1="166" x2="92" y2="160" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="92" x2="24" y2="92" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Tomato Body -->
    <path d="M92 162c-38 0-66-26-66-58 0-25 18-47 43-55 7-2 15-3 23-3 8 0 16 1 23 3 25 8 43 30 43 55 0 32-28 58-66 58z" fill="url(#ru-tomato-body)" filter="drop-shadow(0 8px 24px rgba(239, 68, 68, 0.35))" />

    <!-- Specular Highlight Arc -->
    <path d="M54 78c12-16 28-22 44-20" stroke="url(#ru-tomato-shine)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="50" cy="85" r="3.5" fill="#ffffff" opacity="0.9" />

    <!-- Tomato Calyx Leaves -->
    <path d="M92 50c-6-14-22-18-28-18 2 8 8 16 18 19-12-2-22 4-26 10 9 1 18-2 24-7-6 10-4 22 2 28 0-9 4-16 10-21z" fill="url(#ru-leaf-grad)" />
    <path d="M92 50c6-14 22-18 28-18-2 8-8 16-18 19 12-2 22 4 26 10-9 1-18-2-24-7 6 10 4 22-2 28 0-9-4-16-10-21z" fill="url(#ru-leaf-grad)" />

    <!-- Stem -->
    <path d="M92 52c-2-12 4-24 10-28 2 6 0 16-4 24z" fill="url(#ru-stem-grad)" />

    <!-- Core Center Star Sparkle -->
    <path d="M92 84l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- ════════ BRAND TYPOGRAPHY & TAGLINES (RUSSIAN) ════════ -->
  <g transform="translate(268, 52)">
    <!-- Subtitle Pill / Eyebrow -->
    <rect x="0" y="0" width="170" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10b981" />
    <text x="24" y="16" class="brand-subtitle-ru">Фокус и Поток</text>

    <!-- Wordmark -->
    <text x="0" y="78" class="brand-title-ru">ПОМИДОР</text>
    <!-- Emerald accent dot over the second O -->
    <circle cx="288" cy="54" r="5" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)" />

    <!-- Description / Tagline -->
    <text x="0" y="106" class="brand-tagline-ru">Ритм Фокуса Помидоро • Квесты • Взаимная Ответственность</text>

    <!-- Trust / Feature Badges Row -->
    <g transform="translate(0, 126)">
      <!-- Badge 1: 25m Focus -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="112" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <circle cx="14" cy="13" r="3.5" fill="#ef4444" />
        <text x="24" y="17" class="brand-pill-text-ru">25М СПРИНТЫ</text>
      </g>

      <!-- Badge 2: RPG Hero -->
      <g transform="translate(122, 0)">
        <rect x="0" y="0" width="108" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <circle cx="14" cy="13" r="3.5" fill="#f59e0b" />
        <text x="24" y="17" class="brand-pill-text-ru">РПГ КВЕСТЫ</text>
      </g>

      <!-- Badge 3: Multi-Tenant -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="146" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <circle cx="14" cy="13" r="3.5" fill="#10b981" />
        <text x="24" y="17" class="brand-pill-text-ru">ОТВЕТСТВЕННОСТЬ</text>
      </g>
    </g>
  </g>
</svg>